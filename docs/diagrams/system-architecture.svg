<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-arch-title system-arch-desc" id="system-architecture-root">
      <title id="system-arch-title">Arquitectura híbrida de pre-consulta médica</title>
      <desc id="system-arch-desc">Diagrama de arquitectura que conecta la PWA en Next.js y la app Android nativa con el sanitizador de PII, el endpoint /api/telemed y los motores Gemma 4, Gemini 3.8 Flash y respaldo determinístico.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #system-architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #system-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        <pattern id="system-architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="system-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="system-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="system-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#system-architecture-dots)" opacity="0.55"/>

      <!-- Zone: Inferencia y Respaldo (drawn before arrows and nodes) -->
      <rect x="644" y="64" width="316" height="316" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="744" y="68" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="802" y="77" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">MOTORES CLINICOS</text>

      <!-- Arrows first (behind boxes) -->
      <!-- PWA to Sanitizador PII -->
      <path d="M 184,164 H 212 Q 220,164 220,172 V 216 Q 220,224 228,224 H 248"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#system-architecture-arrow-link)"/>
      <!-- Android to Sanitizador PII -->
      <path d="M 184,308 H 212 Q 220,308 220,300 V 256 Q 220,248 228,248 H 248"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#system-architecture-arrow-link)"/>

      <!-- Sanitizador PII to API Telemed -->
      <line x1="392" y1="236" x2="452" y2="236" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#system-architecture-arrow-accent)"/>

      <!-- API Telemed fan-out to Gemma 4, Gemini 3.8 Flash, Fallback -->
      <path d="M 604,220 H 628 Q 636,220 636,212 V 136 Q 636,128 644,128 H 680"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#system-architecture-arrow)"/>
      <line x1="604" y1="236" x2="680" y2="236" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#system-architecture-arrow-accent)"/>
      <path d="M 604,252 H 628 Q 636,252 636,260 V 324 Q 636,332 644,332 H 680"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#system-architecture-arrow)"/>

      <!-- Arrow labels -->
      <rect x="186" y="144" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="153" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

      <rect x="186" y="316" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="325" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST</text>

      <rect x="398" y="216" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="422" y="225" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIMPIO</text>

      <rect x="616" y="108" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="644" y="117" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASO 2</text>

      <rect x="616" y="216" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="644" y="225" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASO 3</text>

      <rect x="612" y="340" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESPALDO</text>

      <!-- Node 1: PWA Next.js -->
      <rect x="40" y="132" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="132" width="144" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="140" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="64" y="149" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="112" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cliente PWA</text>
      <text x="112" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js 15 · Speech</text>

      <!-- Node 2: App Android -->
      <rect x="40" y="276" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="276" width="144" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="284" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="64" y="293" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="112" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cliente Android</text>
      <text x="112" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kotlin · Compose</text>

      <!-- Node 3: Sanitizador Local PII -->
      <rect x="248" y="204" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="204" width="144" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="256" y="212" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="272" y="221" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="384" y="264" fill="#2d3142" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="320" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sanitizador PII</text>
      <text x="320" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">redactPiiLocally()</text>

      <!-- Node 4: Orquestador /api/telemed (Focal Coral) -->
      <rect x="452" y="204" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="452" y="204" width="152" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="460" y="212" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="476" y="221" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="596" y="264" fill="#eb6c36" fill-opacity="0.10" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
      <text x="528" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orquestador API</text>
      <text x="528" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/telemed</text>

      <!-- Node 5: Gemma 4 Follow-Ups -->
      <rect x="680" y="96" width="256" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="96" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="104" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="706" y="113" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM 1</text>
      <text x="808" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gemma 4 Interroga</text>
      <text x="808" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gemma-4-26b-a4b-it · 1-3 preg</text>

      <!-- Node 6: Gemini 3.8 Flash Deliverables -->
      <rect x="680" y="204" width="256" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="204" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="212" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="706" y="221" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM 2</text>
      <text x="808" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gemini 3.8 Flash</text>
      <text x="808" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SOAP · ISBAR · Pase Paciente</text>

      <!-- Node 7: Motor Determinístico -->
      <rect x="680" y="300" width="256" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="300" width="256" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="688" y="308" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="706" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAFE</text>
      <text x="808" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Motor Clínico Local</text>
      <text x="808" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clinical-engine.ts · offline</text>

      <!-- Legend strip -->
      <line x1="40" y1="404" x2="960" y2="404" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="436" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Orquestador central</text>

      <rect x="200" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Modelos cloud IA</text>

      <rect x="352" y="436" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="372" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Respaldo determinístico</text>

      <rect x="532" y="436" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <text x="552" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Privacidad PII</text>

      <rect x="668" y="436" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="688" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Clientes</text>

      <line x1="768" y1="442" x2="796" y2="442" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#system-architecture-arrow-link)"/>
      <text x="804" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Petición HTTP</text>

      <line x1="892" y1="442" x2="920" y2="442" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#system-architecture-arrow)"/>
      <text x="928" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fallback</text>
    </svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clinical-flow-title clinical-flow-desc" id="clinical-flow-root">
      <title id="clinical-flow-title">Flujo clínico en 3 pasos y doble entregable</title>
      <desc id="clinical-flow-desc">Diagrama de flujo que muestra el relato del paciente por voz, la sanitización local de PII, de 1 a 3 preguntas de seguimiento OPQRST y la generación simultánea del pase del paciente y la ficha médica SOAP/ISBAR.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #clinical-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #clinical-flow-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        <pattern id="clinical-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="clinical-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="clinical-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="clinical-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#clinical-flow-dots)" opacity="0.55"/>

      <!-- Zone: Paso 3 Entregables (drawn before arrows and nodes) -->
      <rect x="752" y="108" width="208" height="264" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="808" y="112" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="856" y="121" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">ENTREGABLES</text>

      <!-- Arrows first (behind boxes) -->
      <line x1="176" y1="240" x2="236" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#clinical-flow-arrow-link)"/>
      <line x1="388" y1="240" x2="452" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#clinical-flow-arrow-accent)"/>
      <line x1="620" y1="240" x2="676" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#clinical-flow-arrow-accent)"/>

      <!-- Fan out from Síntesis Clínica to Pase Paciente (top) and Ficha Médica (bottom) -->
      <path d="M 724,208 V 180 Q 724,172 732,172 H 772"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#clinical-flow-arrow)"/>
      <path d="M 724,272 V 300 Q 724,308 732,308 H 772"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#clinical-flow-arrow)"/>

      <!-- Arrow labels (opaque mask with 8px gap from connector) -->
      <rect x="182" y="220" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="206" y="229" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VOZ STT</text>

      <rect x="396" y="220" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="229" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPQRST</text>

      <rect x="624" y="220" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="229" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1-3 RESP</text>

      <rect x="656" y="152" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="686" y="161" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PACIENTE</text>

      <rect x="664" y="316" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="690" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEDICO</text>

      <!-- Node 1: Relato Libre (Paso 1) -->
      <rect x="40" y="208" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="208" width="136" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="216" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="64" y="225" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASO 1</text>
      <text x="108" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Relato Síntomas</text>
      <text x="108" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Web Speech · texto</text>

      <!-- Node 2: Redactor PII Edge -->
      <rect x="236" y="208" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="236" y="208" width="152" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="244" y="216" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="260" y="225" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="380" y="268" fill="#2d3142" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="312" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Filtro Local PII</text>
      <text x="312" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DPI · tel · nombre</text>

      <!-- Node 3: Seguimiento Dinámico 1-3 Preguntas (Focal Coral) -->
      <rect x="452" y="208" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="452" y="208" width="168" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="460" y="216" width="36" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="478" y="225" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASO 2</text>
      <text x="612" y="268" fill="#eb6c36" fill-opacity="0.10" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
      <text x="536" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Más Información</text>
      <text x="536" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 a 3 preguntas</text>

      <!-- Node 4: Motor Clínico Dual -->
      <rect x="676" y="208" width="96" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="676" y="208" width="96" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="684" y="216" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="698" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IA</text>
      <text x="724" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Síntesis</text>
      <text x="724" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JSON dual</text>

      <!-- Node 5: Pase de Pre-Consulta (Paciente) -->
      <rect x="772" y="140" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="772" y="140" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="780" y="148" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="798" y="157" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASO 3</text>
      <text x="856" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pase del Paciente</text>
      <text x="856" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Alerta · guía · PDF</text>

      <!-- Node 6: Ficha Médica SOAP / ISBAR -->
      <rect x="772" y="276" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="772" y="276" width="168" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="780" y="284" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="798" y="293" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIN</text>
      <text x="856" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ficha SOAP / ISBAR</text>
      <text x="856" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Triaje · citas</text>

      <!-- Legend strip -->
      <line x1="40" y1="404" x2="960" y2="404" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="436" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Paso focal (1-3 preguntas)</text>

      <rect x="220" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Síntesis / vista paciente</text>

      <rect x="400" y="436" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="420" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ficha clínica</text>

      <rect x="524" y="436" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <text x="544" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Privacidad local</text>

      <rect x="660" y="436" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="680" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entrada voz</text>

      <line x1="772" y1="442" x2="800" y2="442" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#clinical-flow-arrow-accent)"/>
      <text x="808" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flujo clínico</text>
    </svg>
